server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_tree_app_db?currentSchema=family_tree&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:family_tree_app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:family_tree}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate #update
    show-sql: true
    properties:
      hibernate:
        default_schema: family_tree
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    schemas: family_tree
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:589984283666-lfqpl9j3tvl9ianh5tnmk67pq6umnnp9.apps.googleusercontent.com}

app:
  google:
    client-id: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:589984283666-lfqpl9j3tvl9ianh5tnmk67pq6umnnp9.apps.googleusercontent.com}

  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long-key}
    expiration-ms: 3600000  # 1 hour

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4000,http://localhost:3000,http://localhost:8080,http://localhost:5000}

  photo:
    max-size-bytes: 102400  # 100 KB

logging:
  level:
    com.familytree: DEBUG
    org.springframework.security: DEBUG
