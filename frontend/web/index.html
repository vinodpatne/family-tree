<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="589984283666-lfqpl9j3tvl9ianh5tnmk67pq6umnnp9.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async></script>

  <script>
    window.gisSelectAccount = function(clientId, successCallback, errorCallback) {
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        errorCallback('Google Identity Services SDK not loaded.');
        return;
      }
      try {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: 'email profile openid',
          callback: (response) => {
            if (response && response.access_token) {
              fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: 'Bearer ' + response.access_token }
              })
              .then(res => res.json())
              .then(userInfo => {
                successCallback(JSON.stringify(userInfo));
              })
              .catch(err => errorCallback(err.toString()));
            } else if (response && response.error) {
              errorCallback(response.error);
            } else {
              errorCallback('popup_closed');
            }
          },
          error_callback: (err) => {
            let msg = 'popup_closed';
            if (err) {
              msg = err.message || err.type || err.toString();
            }
            errorCallback(msg);
          }
        });
        client.requestAccessToken({ prompt: 'select_account' });
      } catch (err) {
        errorCallback(err.toString());
      }
    };
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="family_tree_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Family Tree Application</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
